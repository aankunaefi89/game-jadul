<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Jadul Aankunaefi</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #0b0c10; 
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 15px 10px;
            box-sizing: border-box;
            touch-action: pan-y;
            user-select: none;
            -webkit-user-select: none;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* --- LATAR BELAKANG GAMBAR KOSMIK BERGERAK PELAN --- */
        body::before {
            content: '';
            position: fixed;
            top: -5%;
            left: -5%;
            width: 110%;
            height: 110%;
            background-image: url('assets/img/bg-menu.png');
            background-size: cover;
            background-position: center;
            z-index: -1;
            animation: slowDrift 30s ease-in-out infinite alternate;
            filter: brightness(0.9); /* Diterangkan sedikit agar cerah */
        }

        @keyframes slowDrift {
            0% { transform: scale(1) translate(0, 0); }
            50% { transform: scale(1.05) translate(-10px, -5px); }
            100% { transform: scale(1.03) translate(10px, 5px); }
        }

        /* BANNER WELCOME EFEK KACA TEMBUS PANDANG */
        .welcome-banner {
            width: 95%;
            max-width: 800px;
            background: rgba(0, 0, 0, 0.4); /* Transparan agar latar terlihat */
            border: 2px solid rgba(0, 210, 211, 0.6);
            border-radius: 15px;
            padding: 15px 10px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 210, 211, 0.5);
            margin-bottom: 25px;
            backdrop-filter: blur(4px);
        }
        .welcome-banner h1 {
            margin: 0;
            font-size: 26px;
            color: #f1c40f;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            letter-spacing: 2px;
        }

        /* GRID TOMBOL GAME */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 90%;
            max-width: 500px;
            margin-bottom: 25px;
        }
        .game-btn {
            background-color: rgba(11, 83, 148, 0.7); /* Tombol sedikit transparan */
            color: white;
            border: 2px solid #00d2d3;
            border-radius: 15px;
            padding: 18px 10px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px #0b5394, 0 0 10px rgba(0, 210, 211, 0.3);
            transition: all 0.2s ease;
            text-transform: uppercase;
            backdrop-filter: blur(4px);
        }
        .game-btn:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 7px #0b5394, 0 0 15px rgba(0, 210, 211, 0.6);
        }
        .game-btn:active {
            box-shadow: 0 1px #0b5394;
            transform: translateY(4px);
        }

        /* KOTAK SUPPORT & E-WALLET */
        .support-info {
            width: 90%;
            max-width: 500px;
            font-size: 15px;
            color: #ffffff;
            margin-top: 10px;
            text-align: center;
            background: rgba(0, 0, 0, 0.4); /* Transparan */
            padding: 15px;
            border-radius: 15px;
            border: 1px solid rgba(0, 210, 211, 0.6);
            backdrop-filter: blur(4px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .wallet-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 12px 0;
            flex-wrap: wrap;
        }
        .wallet-logo { height: 22px; object-fit: contain; }
        .account-number {
            font-size: 18px;
            font-weight: 800;
            color: #222;
            background: #fff;
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid #ddd;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
        }

        .txt-ovo { font-weight: 900; color: #a55eea; font-size: 18px; letter-spacing: -0.5px; }
        .txt-dana { font-weight: 900; color: #38ada9; font-size: 18px; letter-spacing: -0.5px; }

        .footer-credit {
            margin-top: 15px;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 0.5px;
            color: #ddd;
        }
        .animated-name {
            display: inline-block;
            font-weight: 800;
            font-size: 18px;
            text-decoration: none;
            background: linear-gradient(270deg,#ff007f,#007bff,#ff007f);
            background-size: 200% auto;
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: moveGradient 3s linear infinite, gentleBlink 1.5s ease-in-out infinite alternate;
        }

        @keyframes moveGradient {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }
        @keyframes gentleBlink {
            0% { opacity: 1; filter: drop-shadow(0 0 2px rgba(0,123,255,0.4)); }
            100% { opacity: 0.7; filter: drop-shadow(0 0 8px rgba(255,0,127,0.8)); }
        }

        .screen { display: none; width: 100%; flex-direction: column; align-items: center; }
        .screen.active { display: flex; }

        .game-container-layout {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            justify-content: center;
            gap: 30px;
            width: 100%;
            max-width: 1400px;
            margin: 20px auto;
            box-sizing: border-box;
        }

        .leaderboard-box {
            width: 340px;
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid #0b5394;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            box-sizing: border-box;
            min-height: 720px;
        }
        .leaderboard-box h3 { margin: 0 0 15px 0; text-align: center; color: #0b5394; font-size: 16px; border-bottom: 2px solid #cfe2f3; padding-bottom: 5px;}
        .score-list { list-style: none; padding: 0; margin: 0; }
        .score-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px dashed #ccc;
            font-size: 14px;
            color: #333;
        }
        .score-item:last-child { border-bottom: none; }

        #game-arena {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(34, 34, 34, 0.95);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 0 25px rgba(0,0,0,0.6);
            box-sizing: border-box;
            min-width: 720px;
            min-height: 720px;
            transition: transform .05s linear;
        }

        .back-btn {
            margin-top: 20px;
            padding: 12px 25px;
            background-color: #cc0000;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 4px #990000;
            margin-bottom: 30px;
        }

        .input-box-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 10px 0;
            background: #333;
            padding: 12px;
            border-radius: 8px;
            width: 90%;
            box-sizing: border-box;
            border: 1px solid #555;
        }
        .input-box-area input {
            padding: 8px;
            width: 85%;
            border-radius: 4px;
            border: 1px solid #ccc;
            margin-bottom: 8px;
            text-align: center;
            font-weight: bold;
        }
        .input-box-area button {
            padding: 8px 16px;
            background: #ffc107;
            border: none;
            color: black;
            font-weight: bold;
            border-radius: 4px;
            width: 85%;
        }

        #powerup-status { font-weight: bold; text-align: center; margin-top: 5px; font-size: 12px; height: 15px; }

        @media (max-width: 1000px) {
            .game-container-layout { flex-direction: column; align-items: center; }
            #game-arena{ min-width:auto; width:100%; }
            .leaderboard-box { width: 100%; min-height: auto; }
        }
    </style>
</head>
<body>

    <!-- ================= SCREEN 1: HALAMAN UTAMA ================= -->
    <div id="main-menu" class="screen active">

                <span id="alt-dana" class="txt-dana" style="display:none;">DANA</span>

    <!-- ================= SCREEN 2: GAME ARENA ================= -->
    <div id="game-screen" class="screen">
        <h2 id="active-game-title" style="color: #0b5394; margin-bottom: 5px;">GAME</h2>
        
        <div class="game-container-layout">
            
            <!-- ARENA PERMAINAN -->
            <div id="game-arena">
                <div id="canvas-placeholder"
                style="
                width:100%;
                height:100%;
                display:flex;
                justify-content:center;
                align-items:center;
                flex-direction:column;
                overflow:hidden;
                ">
        
                    Memuat Permainan...
                </div>
            </div>


            <!-- PAPAN SKOR KIRI -->
            <div class="leaderboard-box">
                <h3 id="leaderboard-title">🏆 TOP 10 SKOR</h3>
                <ul id="score-list" class="score-list">
                    <li class="score-item"><span>Menghubungkan...</span></li>
                </ul>
            </div>

        </div>

        <button class="back-btn" onclick="backToMenu()">◀ Kembali ke Menu Utama</button>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            databaseURL: "https://tabungankeluarga-a091f-default-rtdb.firebaseio.com/"
        };
        
        let database = null;
        try {
            firebase.initializeApp(firebaseConfig);
            database = firebase.database();
        } catch(e) { console.log(e); }

        let currentGame = "";
        let globalScore = 0;
        let globalLevel = 1;

        let audioCtx = null;
        let bgmInterval = null;
        let isBgmPlaying = false;
        let bgmEnabled = true;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playEatSound() {
            if (!audioCtx) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = "square";
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.setValueAtTime(900, audioCtx.currentTime + 0.08); 
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } catch(e){}
        }

        function playHitSound() {
            if (!audioCtx) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = "sawtooth";
                osc.frequency.setValueAtTime(180, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(60, audioCtx.currentTime + 0.4);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            } catch(e){}
        }

        function startBgm() {
            if (!bgmEnabled || isBgmPlaying || !audioCtx) return;
            isBgmPlaying = true;
            let notes = [261.63, 329.63, 392.00, 523.25]; 
            let step = 0;
            
            bgmInterval = setInterval(() => {
                if (!isBgmPlaying || audioCtx.state === 'suspended' || !audioCtx) return;
                try {
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = "triangle"; 
                    osc.frequency.setValueAtTime(notes[step % notes.length], audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.25);
                    step++;
                } catch(e){}
            }, 250); 
        }

        function stopBgm() {
            isBgmPlaying = false;
            if (bgmInterval) {
                clearInterval(bgmInterval);
                bgmInterval = null;
            }
        }

        function toggleBgmToggle() {
            bgmEnabled = !bgmEnabled;
            const btn = document.getElementById("btn-bgm-toggle");
            if (bgmEnabled) {
                btn.innerText = "🎵 BGM: ON";
                btn.style.background = "#27ae60";
                initAudio();
                startBgm();
            } else {
                btn.innerText = "🔇 BGM: OFF";
                btn.style.background = "#7f8c8d";
                stopBgm();
            }
        }

        function openGame(gameName) {
            initAudio();
            currentGame = gameName;
            document.getElementById("main-menu").classList.remove("active");
            document.getElementById("game-screen").classList.add("active");
            
            document.getElementById("active-game-title").innerText = `${gameName.toUpperCase()} - AANKUNAEFI`;
            document.getElementById("leaderboard-title").innerText = `🏆 TOP 10 RANK ${gameName.toUpperCase()}`;

            loadLeaderboard(gameName);

            if (gameName === 'snake') {
                loadSnakeGame();
            } else if (gameName === 'pacman') {
                loadPacmanGame();
            } else if (gameName === 'tetris') {
                document.getElementById("canvas-placeholder").innerHTML = "";
                initTetris();
            } else if (gameName === 'livechat') {
                loadLiveChat();
            } else if (gameName === 'pesawat') {
                loadPesawatGame();
            } else if (gameName === 'mario') {
                loadMarioGame(); // Panggilan untuk Mario Bros
            } else {
                document.getElementById("canvas-placeholder").innerHTML = `<h3 style='color:#fff;'>Game ${gameName.toUpperCase()} sedang dikembangkan!</h3>`;
            }
        }

        function backToMenu() {
            stopBgm();
            
            // 1. Bersihkan memori Game Snake (VERSI BARU)
            if (window.snakeGameInstance) {
                window.snakeGameInstance.stop();
                window.snakeGameInstance = null;
            }

            // 2. Bersihkan memori Game Pesawat
            if (window.pesawatGameInstance) {
                window.pesawatGameInstance.stop();
                window.pesawatGameInstance = null;
            }

            // 3. Bersihkan memori Game Tetris
            if (typeof stopTetris === "function") {
                stopTetris();
            }

            // 4. Bersihkan memori Game Pacman
            if (typeof clearIntervalsAll === "function") {
                try { clearIntervalsAll(); } catch(e) {}
            }

            // 5. Kembalikan ke tampilan Menu Utama
            document.getElementById("game-screen").classList.remove("active");
            document.querySelector(".leaderboard-box").style.display = "block";
            document.getElementById("game-arena").style.width = "";
            document.getElementById("main-menu").classList.add("active");
            
            // 6. Kosongkan kanvas agar memori lega dan bersih
            document.getElementById("canvas-placeholder").innerHTML = "Memuat Permainan...";

            // 7. Bersihkan memori Game Mario
            if (window.marioGameInstance) {
                window.marioGameInstance.stop();
                window.marioGameInstance = null;
            }
        }
        

        function loadLeaderboard(gameName) {
            const scoreListUl = document.getElementById("score-list");
            if(database) {
                database.ref('leaderboard/' + gameName).orderByChild('score').limitToLast(10).on('value', (snapshot) => {
                    scoreListUl.innerHTML = "";
                    let scores = [];
                    snapshot.forEach((childSnapshot) => { scores.push(childSnapshot.val()); });
                    scores.reverse();
                    
                    while(scores.length < 10) {
                        scores.push({name: "-", score: "-", level: "-"});
                    }
                    
                    scoreListUl.innerHTML = "";
                    scores.forEach((item, index) => {
                        const li = document.createElement("li");
                        li.className = "score-item";
                        let scoreDisplay = item.score !== "-" ? `${item.score} (L${item.level})` : "-";
                        li.innerHTML = `<span><b>${index + 1}.</b> ${item.name}</span> <span style="font-weight:bold; color:#0b5394;">${scoreDisplay}</span>`;
                        scoreListUl.appendChild(li);
                    });
                });
            }
        }

        function submitScore() {
    const nameInput = document.getElementById("player-name-input");
    if (!nameInput) return;
    
    const name = nameInput.value.trim();
    if (name === "") return;

    if(database) {
        database.ref('leaderboard/' + currentGame).push({
            name: name,
            score: parseInt(globalScore),
            level: parseInt(globalLevel),
            timestamp: Date.now()
        });
    }

    // HANYA SEMBUNYIKAN BAGIAN INPUT & TOMBOL SIMPAN, JANGAN SEMUA KOTAKNYA
    let formWrapper = document.getElementById("score-form-wrapper");
    if (formWrapper) {
        formWrapper.innerHTML = "<p style='color: #2ecc71; font-weight: bold; text-align: center;'>Skor Berhasil Disimpan! 👍</p>";
    } else {
        // Fallback jika elemen pembungkusnya belum ada, sembunyikan inputnya saja
        nameInput.style.display = "none";
    }
}



        function loadLiveChat(){
document.querySelector(".leaderboard-box").style.display="none";
document.getElementById("game-arena").style.width="100%";
document.getElementById("canvas-placeholder").innerHTML=`
<div style="width:100%;max-width:900px;height:75vh;display:flex;flex-direction:column;background:#202124;border-radius:10px;padding:10px;box-sizing:border-box">
<h2 style="color:#fff;text-align:center">💬 LIVE CHAT</h2>
<div id="chat-box" style="flex:1;overflow-y:auto;background:#111;color:#fff;padding:10px;border-radius:8px"></div>
<input id="chat-name" placeholder="Nama" maxlength="12" style="margin-top:8px;padding:10px">
<input id="chat-message" placeholder="Tulis pesan..." maxlength="120" style="margin-top:8px;padding:10px">
<button onclick="sendChat()" style="margin-top:8px;padding:12px;background:#1976d2;color:#fff;border:none;border-radius:6px">📤 Kirim</button>
</div>`;
listenChat();
document.getElementById("chat-message").addEventListener("keypress",e=>{if(e.key==='Enter')sendChat();});
}
function sendChat(){
            const n=document.getElementById("chat-name").value.trim();
            const m=document.getElementById("chat-message").value.trim();
            if(!n||!m||!database)return;
            database.ref("livechat").push({name:n,message:m,time:Date.now()});
            document.getElementById("chat-message").value="";
        }
        function listenChat(){
            const box=document.getElementById("chat-box");
            if(!database)return;
            database.ref("livechat").limitToLast(50).on("value",s=>{
                box.innerHTML="";
                s.forEach(c=>{
                    const d=c.val();
                    const t=new Date(d.time).toLocaleTimeString();
                    box.innerHTML+=`<div><b>${d.name}</b> <small>${t}</small><br>${d.message}<hr></div>`;
                });
                box.scrollTop=box.scrollHeight;
            });
        }

        

       
    </script>
